# ══════════════════════════════════════════════════════════════════════════════
# CI – Pull Request Checks
#
# PURPOSE:
#   Validates every pull request targeting `main` before it can be merged.
#
# NOTE:
#   backend/ and frontend/ are not checked into this repo (gitignored).
#   This workflow validates only what IS tracked: test infrastructure,
#   Playwright config, page objects, fixtures, and test specs.
#
# JOBS:
#   playwright-checks – install deps, TypeScript check, Prettier format check
#   build-image       – build and push Docker image to GitHub Container Registry
#   e2e-tests         – pull image from GHCR and run Playwright tests in container
# ══════════════════════════════════════════════════════════════════════════════

name: CI – Pull Request Checks

on:
  # Run on every push to main
  push:
    branches: [main]

  # Run on every PR that targets main (opened, new commits pushed, reopened)
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

  # Allow developers to trigger a run manually from the GitHub UI
  workflow_dispatch:

# Cancel any in-progress run for the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '21.7.1'
  IMAGE_NAME: eventhub-e2e

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  JOB – PLAYWRIGHT INFRASTRUCTURE CHECKS
  # ║  Validates the test layer: TypeScript config, formatting, and that all
  # ║  spec/page/fixture files are parseable by Node.js.
  # ╚═══════════════════════════════════════════════════════════════════════════
  playwright-checks:
    name: Playwright Infrastructure Checks
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Node.js setup ────────────────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── Install root dependencies ────────────────────────────────────────────
      # Installs Playwright, Prettier, and concurrently from the root package.json.
      - name: Install dependencies
        run: npm ci

      # ── TypeScript type check ────────────────────────────────────────────────
      # Validates playwright.config.ts compiles cleanly (catches import errors,
      # bad config shapes, etc.) without emitting any output files.
      - name: TypeScript check (playwright.config.ts)
        run: |
          echo "Running TypeScript check on playwright.config.ts..."
          npx tsc --noEmit
          echo "✓ No TypeScript errors found"

      # ── Prettier format check ────────────────────────────────────────────────
      # Ensures all tracked test files (pages/, fixtures/, tests/, config) are
      # formatted. Developers must run `npm run format:fix` locally before pushing.
      - name: Prettier format check
        run: |
          echo "Checking formatting..."
          npm run format
          echo "✓ All files are correctly formatted"

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  JOB – BUILD & PUSH DOCKER IMAGE
  # ║  Builds the test image and pushes it to GitHub Container Registry (GHCR).
  # ║  Uses GitHub Actions layer cache so unchanged layers are not rebuilt.
  # ║  No extra secrets needed — GITHUB_TOKEN is sufficient for GHCR.
  # ╚═══════════════════════════════════════════════════════════════════════════
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: playwright-checks
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tags the image with the commit SHA for full traceability.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  JOB – E2E TESTS (DOCKER)
  # ║  Pulls the image pushed by build-image and runs Playwright against the
  # ║  live staging site. HTML report is uploaded as a workflow artifact.
  # ╚═══════════════════════════════════════════════════════════════════════════
  e2e-tests:
    name: E2E Tests (Playwright / Docker)
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mounts report dirs so artifacts survive container exit.
      - name: Run E2E tests in container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/playwright-report:/app/playwright-report" \
            -v "${{ github.workspace }}/test-results:/app/test-results" \
            ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Runs even on test failure so the report is always available for inspection.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

