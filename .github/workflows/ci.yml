# ══════════════════════════════════════════════════════════════════════════════
# CI – Pull Request Checks
#
# PURPOSE:
#   Validates every pull request targeting `main` before it can be merged.
#
# NOTE:
#   backend/ and frontend/ are not checked into this repo (gitignored).
#   This workflow validates only what IS tracked: test infrastructure,
#   Playwright config, page objects, fixtures, and test specs.
#
# JOBS:
#   playwright-checks – install deps, TypeScript check, Prettier format check
#   e2e-tests         – install Playwright + Chromium, run tests against live site
# ══════════════════════════════════════════════════════════════════════════════

name: CI – Pull Request Checks

on:
  # Run on every push to main
  push:
    branches: [main]

  # Run on every PR that targets main (opened, new commits pushed, reopened)
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

  # Allow developers to trigger a run manually from the GitHub UI
  workflow_dispatch:

# Cancel any in-progress run for the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '21.7.1'

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  JOB – PLAYWRIGHT INFRASTRUCTURE CHECKS
  # ║  Validates the test layer: TypeScript config, formatting, and that all
  # ║  spec/page/fixture files are parseable by Node.js.
  # ╚═══════════════════════════════════════════════════════════════════════════
  playwright-checks:
    name: Playwright Infrastructure Checks
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Node.js setup ────────────────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── Install root dependencies ────────────────────────────────────────────
      # Installs Playwright, Prettier, and concurrently from the root package.json.
      - name: Install dependencies
        run: npm ci

      # ── TypeScript type check ────────────────────────────────────────────────
      # Validates playwright.config.ts compiles cleanly (catches import errors,
      # bad config shapes, etc.) without emitting any output files.
      - name: TypeScript check (playwright.config.ts)
        run: |
          echo "Running TypeScript check on playwright.config.ts..."
          npx tsc --noEmit
          echo "✓ No TypeScript errors found"

      # ── Prettier format check ────────────────────────────────────────────────
      # Ensures all tracked test files (pages/, fixtures/, tests/, config) are
      # formatted. Developers must run `npm run format:fix` locally before pushing.
      - name: Prettier format check
        run: |
          echo "Checking formatting..."
          npm run format
          echo "✓ All files are correctly formatted"

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  JOB – E2E TESTS
  # ║  Installs Playwright + Chromium on the runner and executes tests against
  # ║  the live staging site. No Docker build needed — the runner is sufficient.
  # ╚═══════════════════════════════════════════════════════════════════════════
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: playwright-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      # Runs even on test failure so the report is always available for inspection.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

